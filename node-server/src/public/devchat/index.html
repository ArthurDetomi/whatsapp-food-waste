<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevChat IA</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="index.css" />
  </head>
  <body
    class="bg-gray-200 h-screen w-full flex items-center justify-center p-0 sm:p-4"
  >
    <div
      class="w-full h-full sm:max-w-md sm:h-[85vh] bg-white sm:rounded-xl shadow-2xl flex flex-col overflow-hidden relative"
    >
      <!-- Header -->
      <header
        class="bg-slate-900 text-white p-3 flex items-center shadow-md z-10"
      >
        <div
          class="w-10 h-10 rounded-full bg-white text-[#075e54] flex items-center justify-center font-bold text-xl mr-3 overflow-hidden"
        >
          <svg
            class="w-6 h-6"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
            ></path>
          </svg>
        </div>
        <div class="flex flex-col">
          <span class="font-semibold text-lg leading-tight">DEVCHAT IA</span>
          <span class="text-xs text-gray-200" id="status-text">Online</span>
        </div>
      </header>

      <!-- Chat Area -->
      <main
        id="chat-area"
        class="flex-1 chat-bg overflow-y-auto p-4 flex flex-col space-y-3"
      >
        <!-- Welcome Message
        <div class="flex justify-start">
          <div
            class="msg-ai text-gray-800 p-2.5 rounded-lg max-w-[85%] shadow-sm text-sm relative"
          >
            Olá! Sou o seu assistente de desenvolvimento. Como posso te ajudar
            hoje?
            <span class="text-[10px] text-gray-400 block text-right mt-1"
              >Agora</span
            >
          </div>
        </div>
         -->
      </main>

      <!-- Input Area -->
      <footer
        class="bg-[#f0f0f0] p-3 flex items-center border-t border-gray-300"
      >
        <input
          type="text"
          id="message-input"
          class="flex-1 bg-white border-none focus:ring-0 rounded-full py-2.5 px-4 text-gray-700 text-sm shadow-sm outline-none"
          placeholder="Mensagem..."
          autocomplete="off"
        />
        <button
          id="send-btn"
          class="ml-2 w-10 h-10 rounded-full bg-slate-900 text-white flex items-center justify-center hover:bg-[#007b5a] transition-colors focus:outline-none focus:ring-2 focus:ring-[#008f68] focus:ring-opacity-50"
        >
          <svg
            class="w-5 h-5 ml-1"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"
            ></path>
          </svg>
        </button>
      </footer>
    </div>

    <script src="index.js"></script>
  </body>
</html>
